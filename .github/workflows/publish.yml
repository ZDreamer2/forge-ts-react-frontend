name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to verify and publish
        required: true
        type: string
      publish:
        description: Publish to npm (false only validates and dry-runs)
        type: boolean
        default: false

permissions:
  contents: read

# Never overlap two publication attempts, and do not interrupt an in-flight publication.
concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  guard:
    name: Plan release on main
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      version: ${{ steps.plan.outputs.version }}
      run: ${{ steps.plan.outputs.run }}
      publish: ${{ steps.plan.outputs.publish }}
      unpublished: ${{ steps.plan.outputs.unpublished }}
    steps:
      - run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check manifest and registry version
        id: plan
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(manifest.name, '@zdreamer/forge-ts-react-frontend');
          assert.equal(typeof manifest.version, 'string');
          assert.ok(manifest.version && !/[\r\n]/.test(manifest.version));
          const automatic = process.env.GITHUB_EVENT_NAME === 'push';
          assert.ok(automatic || process.env.GITHUB_EVENT_NAME === 'workflow_dispatch');
          let publish = process.env.PUBLISH_REQUESTED === 'true';
          let run = true;
          if (!automatic) {
            assert.equal(manifest.version, process.env.EXPECTED_VERSION, 'Requested version differs from package.json');
          }
          const response = await fetch('https://registry.npmjs.org/' + encodeURIComponent(manifest.name), {
            signal: AbortSignal.timeout(30000),
            headers: { 'Cache-Control': 'no-cache' },
          });
          assert.ok(response.status === 200 || response.status === 404, 'Registry lookup failed; refusing publication');
          const missing = response.status === 404;
          let unpublished = true;
          if (!missing) {
            const registry = await response.json();
            assert.equal(registry.name, manifest.name);
            assert.ok(registry.versions && typeof registry.versions === 'object' && !Array.isArray(registry.versions));
            unpublished = !Object.hasOwn(registry.versions, manifest.version);
          }
          if (automatic) {
            // The owner bootstraps a missing package from the verified CI artifact.
            publish = !missing && unpublished;
            run = missing || publish;
          }
          assert.ok(!publish || !missing, 'First publication is owner-operated; use the verified CI artifact');
          assert.ok(!publish || unpublished, 'Requested version is already published');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\nrun=${run}\npublish=${publish}\nunpublished=${unpublished}\n`);
          console.log(run ? `Verify ${manifest.name}@${manifest.version}; publish=${publish}` : `${manifest.name}@${manifest.version} already exists; skipping release`);
          JS

  verify:
    name: Verify release source
    needs: guard
    if: ${{ needs.guard.outputs.run == 'true' }}
    uses: ./.github/workflows/ci.yml
    with:
      expected-version: ${{ needs.guard.outputs.version }}

  publish:
    name: Dry-run or publish verified artifact
    needs: [guard, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare OIDC-capable npm
        run: npm install --global npm@11.19.0 --ignore-scripts
      - name: Download this run's checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package
      - name: Validate artifact identity and integrity
        env:
          EXPECTED_VERSION: ${{ needs.guard.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const directory = join(process.env.RUNNER_TEMP, 'npm-package');
          const [packed] = JSON.parse(readFileSync(join(directory, 'pack.json'), 'utf8'));
          assert.equal(packed.name, '@zdreamer/forge-ts-react-frontend');
          assert.equal(packed.version, process.env.EXPECTED_VERSION);
          assert.equal(packed.filename, `zdreamer-forge-ts-react-frontend-${packed.version}.tgz`);
          assert.deepEqual(packed.files.map(file => file.path).sort(), ['LICENSE', 'README.md', 'package.json']);
          assert.deepEqual(readdirSync(directory).filter(name => name.endsWith('.tgz')), [packed.filename]);
          const integrity = 'sha512-' + createHash('sha512').update(readFileSync(join(directory, packed.filename))).digest('base64');
          assert.equal(integrity, packed.integrity);
          JS
      - name: Dry-run npm publication of an unpublished version
        if: ${{ needs.guard.outputs.unpublished == 'true' }}
        run: npm publish "$RUNNER_TEMP"/npm-package/*.tgz --dry-run --ignore-scripts --access public --registry=https://registry.npmjs.org/
      - name: Report existing-version verification
        if: ${{ needs.guard.outputs.unpublished != 'true' }}
        run: echo 'Artifact verified; npm dry-run skipped because this version is already published.'
      # No npm token or environment secret: npm discovers this job's GitHub OIDC identity.
      # Pushes dry-run a missing package; after owner bootstrap, new versions publish automatically.
      - name: Publish with provenance through npm trusted publishing
        if: ${{ needs.guard.outputs.publish == 'true' }}
        run: npm publish "$RUNNER_TEMP"/npm-package/*.tgz --ignore-scripts --access public --provenance --registry=https://registry.npmjs.org/
