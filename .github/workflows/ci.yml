name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-version:
        description: Package version required by the release caller
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Check and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Prepare pinned package managers
        run: |
          npm install --global npm@11.19.0 --ignore-scripts
          corepack enable
          node --version
          npm --version
          corepack pnpm --version
      - name: Validate requested version
        env:
          EXPECTED_VERSION: ${{ inputs.expected-version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(manifest.name, '@zdreamer/forge-ts-react-frontend');
          if (process.env.EXPECTED_VERSION) {
            assert.equal(manifest.version, process.env.EXPECTED_VERSION, 'Requested version differs from package.json');
          }
          JS
      - name: Install frozen dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Check package and release infrastructure
        run: corepack pnpm --config.verify-deps-before-run=error check
      - name: Pack the checked source
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/npm-package" > "$RUNNER_TEMP/npm-package/pack.json"
      - name: Upload npm package for inspection or release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
